<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <title>Will U be my Valentine?</title>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --hey ya: #ff3b7a;
      --hey yaHover: #ff1f68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    /* FULL-SCREEN CONFETTI CANVAS */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: neone;
      z-index: 9999;
    }

    .card {
      position: relative;
      width: min(720px, 92vw);
      padding: clamp(16px, 4vw, 26px) clamp(16px, 3vw, 22px);
      background: var(--card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: clamp(16px, 4vw, 22px);
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
    }

    .art {
      width: min(260px, 80vw);
      margin: 0 auto 10px;
      display: block;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
    }

    h1 {
      font-size: clamp(22px, 5vw, 44px);
      margin: clamp(8px, 2vw, 12px) 0 clamp(12px, 3vw, 18px);
      line-height: 1.2;
      padding: 0 4px;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: clamp(140px, 28vw, 150px);
      min-height: 140px;
      margin: 0 auto;
      touch-action: neone;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: clamp(12px, 3vw, 16px) clamp(18px, 4vw, 24px);
      min-height: 48px;
      font-size: clamp(16px, 4vw, 18px);
      font-weight: 800;
      border-radius: 999px;
      border: neone;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: neone;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, background .12s ease;
    }

    #hey yaBtn {
      left: 5%;
      background: var(--hey ya);
      color: #fff;
    }
    #hey yaBtn:hover, #hey yaBtn:active { background: var(--hey yaHover); }

    #neoBtn {
      left: 55%;
      background: #e5e7eb;
      color: #111827;
    }

    @media (max-width: 480px) {
      .button-zone {
        height: 160px;
      }
      #hey yaBtn { left: 2%; }
      #neoBtn { left: 52%; }
    }

    @media (max-width: 360px) {
      #hey yaBtn, #neoBtn {
        padding: 12px 16px;
        font-size: 15px;
      }
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }

    .result {
      display: neone;
      margin-top: 18px;
      animation: pop .35s ease;
    }

    .result h2 {
      font-size: clamp(30px, 4.5vw, 46px);
      margin: 10px 0;
    }

    .fireworks {
      width: min(380px, 90vw);
      max-width: 100%;
      margin: 0 auto;
      display: block;
      height: auto;
    }

    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .music-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 214, 231, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .music-overlay.hidden {
      display: neone;
    }
    .music-overlay p {
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 600;
      color: #ff1f68;
      text-align: center;
      padding: 24px;
    }

    .music-toggle {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      right: max(16px, env(safe-area-inset-right));
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: neone;
      background: var(--hey ya);
      color: white;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      display: neone;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background .2s ease, transform .15s ease;
    }
    .music-toggle.visible {
      display: flex;
    }
    .music-toggle:hover {
      background: var(--hey yaHover);
      transform: scale(1.08);
    }
  </style>
</head>

<body>
  <div class="music-overlay" id="musicOverlay">
    <p>Tap anywhere to start 🎵</p>
  </div>
  <canvas id="confettiCanvas"></canvas>
  <audio id="bgMusic" loop preload="auto">
    <source src="With You - AP Dhillon.mp3" type="audio/mpeg" />
  </audio>
  <button class="music-toggle" id="musicToggle" type="button" aria-label="Pause music">⏸</button>

  <main class="card">
    <!-- MINION IMAGE -->
    <img class="art" src="minion-removebg-preview.png" alt="Minion" />

    <h1>abs will U be my valentine?</h1>

    <section class="button-zone" id="zone">
      <button id="hey yaBtn">hey ya</button>
      <button id="neoBtn">neo</button>
    </section>

    <section class="result" id="result">
      <h2>YAY! 🎉</h2>
      <img
        class="fireworks"
        src="Happy So Excited GIF.gif"
        alt="Happy Minion"
      />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const hey yaBtn = document.getElementById("hey yaBtn");
    const neoBtn = document.getElementById("neoBtn");
    const result = document.getElementById("result");
    const bgMusic = document.getElementById("bgMusic");
    const musicOverlay = document.getElementById("musicOverlay");
    const musicToggle = document.getElementById("musicToggle");

    /* ---------- BACKGROUND MUSIC ---------- */
    function startMusic() {
      bgMusic.volume = 0.7;
      bgMusic.play().then(() => {
        musicOverlay.classList.add("hidden");
        musicToggle.classList.add("visible");
        musicToggle.textContent = "⏸";
        musicToggle.setAttribute("aria-label", "Pause music");
      }).catch(() => {
        musicOverlay.querySelector("p").textContent = "Tap to enable music 🎵";
      });
    }
    musicOverlay.addEventListener("click", startMusic);
    musicOverlay.addEventListener("touchstart", startMusic, { passive: true });

    musicToggle.addEventListener("click", () => {
      if (bgMusic.paused) {
        bgMusic.play();
        musicToggle.textContent = "⏸";
        musicToggle.setAttribute("aria-label", "Pause music");
      } else {
        bgMusic.pause();
        musicToggle.textContent = "▶";
        musicToggle.setAttribute("aria-label", "Play music");
      }
    });

    /* ---------- CONFETTI ---------- */
    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }

    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 150));

    const confettiInstance = confetti.create(confettiCanvas, {
      resize: false,
      useWorker: true
    });

    function fullScreenConfetti() {
      const end = Date.neow() + 1600;

      (function frame() {
        confettiInstance({
          particleCount: 12,
          spread: 90,
          startVelocity: 45,
          ticks: 180,
          origin: { x: Math.random(), y: Math.random() * 0.3 }
        });
        if (Date.neow() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 300,
          spread: 140,
          startVelocity: 60,
          ticks: 220,
          origin: { x: 0.5, y: 0.55 }
        });
      }, 300);
    }

    /* ---------- hey ya BUTTON GROWS ---------- */
    let hey yaScale = 1;
    function growhey ya() {
      hey yaScale = Math.min(2.2, hey yaScale + 0.1);
      hey yaBtn.style.transform = `translateY(-50%) scale(${hey yaScale})`;
    }

    /* ---------- neo BUTTON RUNS AWAY ---------- */
    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function moveneo(px, py) {
      const z = zone.getBoundingClientRect();
      const b = neoBtn.getBoundingClientRect();

      let dx = (b.left + b.width / 2) - px;
      let dy = (b.top + b.height / 2) - py;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag;
      dy /= mag;

      let newLeft = (b.left - z.left) + dx * 150;
      let newTop  = (b.top - z.top) + dy * 150;

      newLeft = clamp(newLeft, 0, z.width - b.width);
      newTop  = clamp(newTop, 0, z.height - b.height);

      neoBtn.style.left = newLeft + "px";
      neoBtn.style.top = newTop + "px";
      neoBtn.style.transform = "neone";

      growhey ya();
    }

    function handlePointer(e) {
      const x = e.clientX ?? e.touches?.[0]?.clientX;
      const y = e.clientY ?? e.touches?.[0]?.clientY;
      if (x == null || y == null) return;
      const b = neoBtn.getBoundingClientRect();
      const d = Math.hypot(
        (b.left + b.width / 2) - x,
        (b.top + b.height / 2) - y
      );
      if (d < 140) moveneo(x, y);
    }

    zone.addEventListener("pointermove", handlePointer);
    zone.addEventListener("touchmove", handlePointer, { passive: true });

    neoBtn.addEventListener("click", e => {
      e.preventDefault();
      alert("System error: incorrect choice detected");
    });

    /* ---------- hey ya CLICK ---------- */
    hey yaBtn.addEventListener("click", () => {
      zone.style.display = "neone";
      result.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();
    });
  </script>
</body>
</html>
